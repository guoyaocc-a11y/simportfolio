<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">SimPortfolio - Global Private Asset Multi-Currency Terminal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

    <!-- Top Navigation -->
    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white text-lg">S</div>
                <span class="text-xl font-bold tracking-tight">SimPortfolio<span id="nav-subtitle" class="text-indigo-400 text-sm ml-2 font-normal"></span></span>
            </div>
            <div class="flex items-center space-x-3">
                <!-- Language Switch Button -->
                <button onclick="toggleLanguage()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium px-3 py-2 rounded-xl transition border border-slate-700" id="lang-btn">
                    Switch to English
                </button>
                <!-- Exchange Rate Setting Bar -->
                <div class="hidden md:flex items-center space-x-2 bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800 text-xs">
                    <span class="text-slate-400" data-i18n="rateLabel">💱 汇率设定:</span>
                    <label class="text-slate-300">USD/CNY:</label>
                    <input type="number" step="0.0001" id="rate-usd" value="7.25" oninput="updateRates()" class="w-16 bg-slate-900 border border-slate-700 rounded px-1.5 py-0.5 text-center text-indigo-300 font-bold focus:outline-none">
                    <label class="text-slate-300 ml-2">HKD/CNY:</label>
                    <input type="number" step="0.0001" id="rate-hkd" value="0.93" oninput="updateRates()" class="w-16 bg-slate-900 border border-slate-700 rounded px-1.5 py-0.5 text-center text-indigo-300 font-bold focus:outline-none">
                </div>
                <button onclick="addNewCategory()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium px-3.5 py-2 rounded-xl transition shadow" data-i18n="addCategory">
                    + 新增大类资产
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Asset Lists (7 Cols) -->
        <section id="categories-container" class="lg:col-span-7 space-y-6">
            <!-- Dynamically rendered categories -->
        </section>

        <!-- Right Dashboard & Charts (5 Cols) -->
        <section class="lg:col-span-5 space-y-6 sticky top-20 h-fit">
            <!-- Statistics & Snapshot -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="text-sm font-semibold text-slate-300" data-i18n="overviewTitle">资产总览与收盘记录 (折算人民币)</h3>
                    <button onclick="recordDailySnapshot()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3.5 py-2 rounded-xl transition font-medium shadow" data-i18n="snapshotBtn">
                        📸 记录今日收盘净值
                    </button>
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <div class="bg-slate-950 p-3 rounded-xl border border-slate-800/80">
                        <span class="text-[10px] text-slate-400 block mb-1" data-i18n="labelCost">初始总投入 (¥)</span>
                        <span id="total-cost" class="text-sm font-bold text-slate-200">¥0.00</span>
                    </div>
                    <div class="bg-slate-950 p-3 rounded-xl border border-slate-800/80">
                        <span class="text-[10px] text-slate-400 block mb-1" data-i18n="labelValue">当前总净值 (¥)</span>
                        <span id="total-value" class="text-sm font-bold text-white">¥0.00</span>
                    </div>
                    <div class="bg-slate-950 p-3 rounded-xl border border-slate-800/80">
                        <span class="text-[10px] text-slate-400 block mb-1" data-i18n="labelProfit">总浮动盈亏 (¥)</span>
                        <span id="total-profit" class="text-sm font-bold text-emerald-400">+¥0.00</span>
                    </div>
                </div>
            </div>

            <!-- Pie Chart -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <h3 class="text-sm font-semibold text-slate-200 mb-3" data-i18n="pieTitle">大类资产配置比例 (按人民币市值)</h3>
                <div class="relative h-[200px] w-full flex items-center justify-center">
                    <canvas id="assetPieChart"></canvas>
                </div>
            </div>

            <!-- Line Chart -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-sm font-semibold text-slate-200" data-i18n="lineTitle">历史净值成长曲线 (人民币)</h3>
                    <button onclick="clearHistory()" class="text-[10px] text-rose-400 hover:underline" data-i18n="clearHistory">清空历史记录</button>
                </div>
                <div class="relative h-[180px] w-full flex items-center justify-center">
                    <canvas id="portfolioLineChart"></canvas>
                </div>
            </div>
        </section>

    </main>

    <!-- Core Script -->
    <script>
        // 全局多语言字典
        const i18n = {
            zh: {
                pageTitle: "SimPortfolio - 全球私人资产多币种终端",
                navSubtitle: "多币种资产终端 (统一折算CNY)",
                langBtn: "Switch to English",
                rateLabel: "💱 汇率设定:",
                addCategory: "+ 新增大类资产",
                overviewTitle: "资产总览与收盘记录 (折算人民币)",
                snapshotBtn: "📸 记录今日收盘净值",
                labelCost: "初始总投入 (¥)",
                labelValue: "当前总净值 (¥)",
                labelProfit: "总浮动盈亏 (¥)",
                pieTitle: "大类资产配置比例 (按人民币市值)",
                lineTitle: "历史净值成长曲线 (人民币)",
                clearHistory: "清空历史记录",
                thTicker: "代码/说明",
                thCurrency: "币种",
                thShares: "数量",
                thCost: "成本价",
                thPrice: "当前单价",
                thValue: "折算市值(¥)",
                thAction: "操作",
                btnDelete: "删除",
                btnRemoveCat: "删除板块",
                btnAddItem: "+ 添加标的",
                promptCat: "请输入新大类名称：",
                promptCatDefault: "海外大类",
                confirmDelCat: "确定删除该大类及所有明细吗？",
                confirmClearHist: "确定清空所有历史快照吗？",
                alertSnapshot: "✅ 已记录收盘人民币快照",
                initBase: "初始成本基准",
                latest: "当前最新",
                defaultCategories: [
                    { name: '📈 股票类资产', items: [{ ticker: 'POPMART', currency: 'HKD', shares: 400, cost: 152.316, price: 152.1 }] },
                    { name: '🪙 加密货币与合约', items: [{ ticker: 'BTC', currency: 'CNY', shares: 1, cost: 47240.5, price: 47240.5 }] },
                    { name: '🥇 大宗类', items: [{ ticker: 'GOLD518850', currency: 'CNY', shares: 1800, cost: 8.669, price: 8.881 }] }
                ]
            },
            en: {
                pageTitle: "SimPortfolio - Global Private Asset Multi-Currency Terminal",
                navSubtitle: "Multi-Currency Terminal (Converted to CNY)",
                langBtn: "切换至中文",
                rateLabel: "💱 Rates:",
                addCategory: "+ Add Category",
                overviewTitle: "Portfolio Overview & Snapshot (Converted to CNY)",
                snapshotBtn: "📸 Record Today's Snapshot",
                labelCost: "Initial Cost (¥)",
                labelValue: "Current Value (¥)",
                labelProfit: "Total Profit/Loss (¥)",
                pieTitle: "Asset Allocation (By CNY Market Value)",
                lineTitle: "Historical Value Growth Curve (CNY)",
                clearHistory: "Clear History",
                thTicker: "Ticker/Name",
                thCurrency: "Currency",
                thShares: "Shares",
                thCost: "Cost Price",
                thPrice: "Current Price",
                thValue: "Value (¥)",
                thAction: "Action",
                btnDelete: "Delete",
                btnRemoveCat: "Remove",
                btnAddItem: "+ Add Asset",
                promptCat: "Enter new category name:",
                promptCatDefault: "Global Assets",
                confirmDelCat: "Are you sure to delete this category?",
                confirmClearHist: "Are you sure to clear all history snapshots?",
                alertSnapshot: "✅ Recorded CNY snapshot",
                initBase: "Initial Cost Base",
                latest: "Latest",
                defaultCategories: [
                    { name: '📈 Equities', items: [{ ticker: 'POPMART', currency: 'HKD', shares: 400, cost: 152.316, price: 152.1 }] },
                    { name: '🪙 Crypto & Futures', items: [{ ticker: 'BTC', currency: 'CNY', shares: 1, cost: 47240.5, price: 47240.5 }] },
                    { name: '🥇 Commodities', items: [{ ticker: 'GOLD518850', currency: 'CNY', shares: 1800, cost: 8.669, price: 8.881 }] }
                ]
            }
        };

        // 默认语言初始化（如果没有记录则默认中文）
        let currentLang = localStorage.getItem('sim_lang') || 'zh';

        let portfolio = JSON.parse(localStorage.getItem('sim_multicurrency_portfolio_v7')) || {
            rates: { usd: 7.25, hkd: 0.93 },
            categories: i18n[currentLang].defaultCategories,
            history: [] 
        };

        document.getElementById('rate-usd').value = portfolio.rates.usd;
        document.getElementById('rate-hkd').value = portfolio.rates.hkd;

        let pieChart = null;
        let lineChart = null;

        function toggleLanguage() {
            const oldLang = currentLang;
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            localStorage.setItem('sim_lang', currentLang);

            // 智能映射默认板块名称，防止切换时板块名错乱
            portfolio.categories.forEach(cat => {
                if (oldLang === 'zh') {
                    if (cat.name === '📈 股票类资产') cat.name = '📈 Equities';
                    else if (cat.name === '🪙 加密货币与合约') cat.name = '🪙 Crypto & Futures';
                    else if (cat.name === '🥇 大宗类') cat.name = '🥇 Commodities';
                } else {
                    if (cat.name === '📈 Equities') cat.name = '📈 股票类资产';
                    else if (cat.name === '🪙 Crypto & Futures') cat.name = '🪙 加密货币与合约';
                    else if (cat.name === '🥇 Commodities') cat.name = '🥇 大宗类';
                }
            });

            saveData();
            render();
        }

        function updateUIText() {
            const t = i18n[currentLang];
            document.getElementById('page-title').innerText = t.pageTitle;
            document.getElementById('nav-subtitle').innerText = t.navSubtitle;
            document.getElementById('lang-btn').innerText = t.langBtn;
            
            // 遍历所有带有 data-i18n 属性的标签进行全域翻译更新
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.innerText = t[key];
            });
        }

        function updateRates() {
            portfolio.rates.usd = Number(document.getElementById('rate-usd').value) || 1;
            portfolio.rates.hkd = Number(document.getElementById('rate-hkd').value) || 1;
            saveData();
        }

        function getMultiplier(currency) {
            if (currency === 'USD') return portfolio.rates.usd;
            if (currency === 'HKD') return portfolio.rates.hkd;
            return 1;
        }

        function render() {
            updateUIText();
            const t = i18n[currentLang];
            const container = document.getElementById('categories-container');
            container.innerHTML = '';

            portfolio.categories.forEach((cat, catIdx) => {
                const card = document.createElement('div');
                card.className = 'bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl';
                card.innerHTML = `
                    <div class="flex items-center justify-between mb-3">
                        <input type="text" value="${cat.name}" onchange="updateCatName(${catIdx}, this.value)" 
                               class="bg-transparent text-sm font-bold text-slate-200 border-b border-transparent hover:border-slate-700 focus:border-indigo-500 focus:outline-none px-1">
                        <div class="flex space-x-2">
                            <button onclick="addItem(${catIdx})" class="text-xs bg-indigo-600/80 hover:bg-indigo-600 text-white px-2.5 py-1 rounded-lg transition">${t.btnAddItem}</button>
                            <button onclick="removeCat(${catIdx})" class="text-xs text-rose-400 hover:text-rose-300 px-1.5 py-1 bg-rose-950/30 rounded border border-rose-900/50">${t.btnRemoveCat}</button>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs">
                            <thead>
                                <tr class="border-b border-slate-800 text-slate-400">
                                    <th class="pb-2 font-medium w-28">${t.thTicker}</th>
                                    <th class="pb-2 font-medium w-16">${t.thCurrency}</th>
                                    <th class="pb-2 font-medium">${t.thShares}</th>
                                    <th class="pb-2 font-medium">${t.thCost}</th>
                                    <th class="pb-2 font-medium">${t.thPrice}</th>
                                    <th class="pb-2 font-medium">${t.thValue}</th>
                                    <th class="pb-2 font-medium text-right">${t.thAction}</th>
                                </tr>
                            </thead>
                            <tbody id="tbody-${catIdx}" class="divide-y divide-slate-800/50"></tbody>
                        </table>
                    </div>
                `;
                container.appendChild(card);

                const tbody = document.getElementById(`tbody-${catIdx}`);
                cat.items.forEach((item, itemIdx) => {
                    const rate = getMultiplier(item.currency);
                    const mValCNY = item.shares * item.price * rate;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="py-2.5 pr-2"><input type="text" value="${item.ticker}" oninput="saveData()" id="t-${catIdx}-${itemIdx}" class="w-full bg-slate-950 border border-slate-800 rounded px-2 py-1 text-xs text-indigo-300 font-bold uppercase focus:outline-none focus:border-indigo-500"></td>
                        <td class="py-2.5 pr-2">
                            <select onchange="saveData()" id="cur-${catIdx}-${itemIdx}" class="bg-slate-950 border border-slate-800 rounded px-1.5 py-1 text-xs text-amber-300 font-bold focus:outline-none focus:border-indigo-500">
                                <option value="CNY" ${item.currency==='CNY'?'selected':''}>CNY</option>
                                <option value="USD" ${item.currency==='USD'?'selected':''}>USD</option>
                                <option value="HKD" ${item.currency==='HKD'?'selected':''}>HKD</option>
                            </select>
                        </td>
                        <td class="py-2.5 pr-2"><input type="number" step="any" value="${item.shares}" oninput="saveData()" id="s-${catIdx}-${itemIdx}" class="w-16 bg-slate-950 border border-slate-800 rounded px-2 py-1 text-xs text-white focus:outline-none focus:border-indigo-500"></td>
                        <td class="py-2.5 pr-2"><input type="number" step="any" value="${item.cost}" oninput="saveData()" id="c-${catIdx}-${itemIdx}" class="w-20 bg-slate-950 border border-slate-800 rounded px-2 py-1 text-xs text-white focus:outline-none focus:border-indigo-500"></td>
                        <td class="py-2.5 pr-2"><input type="number" step="any" value="${item.price}" oninput="saveData()" id="p-${catIdx}-${itemIdx}" class="w-20 bg-slate-950 border border-indigo-900/80 rounded px-2 py-1 text-xs text-indigo-300 font-medium focus:outline-none focus:border-indigo-500"></td>
                        <td class="py-2.5 pr-2 text-xs text-slate-300 font-medium" id="v-${catIdx}-${itemIdx}">¥${mValCNY.toFixed(2)}</td>
                        <td class="py-2.5 text-right"><button onclick="removeItem(${catIdx}, ${itemIdx})" class="text-rose-400 hover:text-rose-300 text-xs px-1.5 py-0.5 bg-rose-950/30 rounded border border-rose-900/50">${t.btnDelete}</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            });

            calculate();
        }

        function addNewCategory() {
            const t = i18n[currentLang];
            const name = prompt(t.promptCat, t.promptCatDefault);
            if (!name) return;
            portfolio.categories.push({ name: name, items: [{ ticker: 'NEW', currency: 'USD', shares: 10, cost: 100, price: 100 }] });
            saveData();
            render();
        }

        function updateCatName(catIdx, val) {
            portfolio.categories[catIdx].name = val;
            saveData();
        }

        function removeCat(catIdx) {
            const t = i18n[currentLang];
            if (confirm(t.confirmDelCat)) {
                portfolio.categories.splice(catIdx, 1);
                saveData();
                render();
            }
        }

        function addItem(catIdx) {
            portfolio.categories[catIdx].items.push({ ticker: 'ASSET', currency: 'USD', shares: 10, cost: 50, price: 50 });
            saveData();
            render();
        }

        function removeItem(catIdx, itemIdx) {
            portfolio.categories[catIdx].items.splice(itemIdx, 1);
            saveData();
            render();
        }

        function saveData() {
            portfolio.rates.usd = Number(document.getElementById('rate-usd').value) || 1;
            portfolio.rates.hkd = Number(document.getElementById('rate-hkd').value) || 1;

            portfolio.categories.forEach((cat, catIdx) => {
                cat.items.forEach((item, itemIdx) => {
                    const t = document.getElementById(`t-${catIdx}-${itemIdx}`);
                    const cur = document.getElementById(`cur-${catIdx}-${itemIdx}`);
                    const s = document.getElementById(`s-${catIdx}-${itemIdx}`);
                    const c = document.getElementById(`c-${catIdx}-${itemIdx}`);
                    const p = document.getElementById(`p-${catIdx}-${itemIdx}`);
                    if (!t) return;

                    item.ticker = t.value.trim().toUpperCase();
                    item.currency = cur.value;
                    item.shares = Number(s.value) || 0;
                    item.cost = Number(c.value) || 0;
                    item.price = Number(p.value) || 0;

                    const rate = getMultiplier(item.currency);
                    const mValCNY = item.shares * item.price * rate;
                    document.getElementById(`v-${catIdx}-${itemIdx}`).innerText = `¥${mValCNY.toFixed(2)}`;
                });
            });

            localStorage.setItem('sim_multicurrency_portfolio_v7', JSON.stringify(portfolio));
            calculate();
        }

        function calculate() {
            let totalValCNY = 0;
            let totalCostCNY = 0;
            let catTotals = {};

            portfolio.categories.forEach(cat => {
                let cVal = 0;
                cat.items.forEach(item => {
                    const rate = getMultiplier(item.currency);
                    cVal += item.shares * item.price * rate;
                    totalCostCNY += item.shares * item.cost * rate;
                });
                totalValCNY += cVal;
                catTotals[cat.name] = cVal;
            });

            let totalProfitCNY = totalValCNY - totalCostCNY;

            document.getElementById('total-cost').innerText = `¥${totalCostCNY.toLocaleString('zh-CN', {maximumFractionDigits: 2})}`;
            document.getElementById('total-value').innerText = `¥${totalValCNY.toLocaleString('zh-CN', {maximumFractionDigits: 2})}`;
            
            const pElem = document.getElementById('total-profit');
            pElem.innerText = `${totalProfitCNY >= 0 ? '+' : ''}¥${totalProfitCNY.toLocaleString('zh-CN', {maximumFractionDigits: 2})}`;
            pElem.className = `text-sm font-bold ${totalProfitCNY >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;

            renderCharts(catTotals, totalValCNY, totalCostCNY);
        }

        function recordDailySnapshot() {
            let totalValCNY = 0;
            portfolio.categories.forEach(cat => {
                cat.items.forEach(item => {
                    const rate = getMultiplier(item.currency);
                    totalValCNY += item.shares * item.price * rate;
                });
            });

            const now = new Date();
            const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            
            if (portfolio.history.length > 0 && portfolio.history[portfolio.history.length - 1].time.startsWith(timeStr.slice(0, 10))) {
                portfolio.history[portfolio.history.length - 1] = { time: timeStr, value: totalValCNY };
            } else {
                portfolio.history.push({ time: timeStr, value: totalValCNY });
            }

            localStorage.setItem('sim_multicurrency_portfolio_v7', JSON.stringify(portfolio));
            calculate();
            const t = i18n[currentLang];
            alert(`${t.alertSnapshot} (${timeStr})：¥${totalValCNY.toFixed(2)}`);
        }

        function clearHistory() {
            const t = i18n[currentLang];
            if (confirm(t.confirmClearHist)) {
                portfolio.history = [];
                localStorage.setItem('sim_multicurrency_portfolio_v7', JSON.stringify(portfolio));
                calculate();
            }
        }

        function renderCharts(catTotals, totalVal, totalCost) {
            const t = i18n[currentLang];
            const labels = Object.keys(catTotals);
            const values = Object.values(catTotals);
            
            const formattedLabels = labels.map((l, i) => {
                const pct = totalVal > 0 ? ((values[i] / totalVal) * 100).toFixed(1) : 0;
                return `${l} (${pct}%)`;
            });

            // 1. 环形图 (Pie/Doughnut Chart)
            const ctxPie = document.getElementById('assetPieChart').getContext('2d');
            if (pieChart) pieChart.destroy();
            pieChart = new Chart(ctxPie, {
                type: 'doughnut',
                data: {
                    labels: formattedLabels,
                    datasets: [{
                        data: values,
                        backgroundColor: ['#6366f1', '#f59e0b', '#a855f7', '#10b981', '#ec4899', '#38bdf8'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { position: 'right', labels: { color: '#94a3b8', boxWidth: 10, font: { size: 10 } } } 
                    }
                }
            });

            // 2. 折线图 (Line Chart)
            let timeLabels = [];
            let histValues = [];

            if (portfolio.history && portfolio.history.length >= 2) {
                timeLabels = portfolio.history.map(h => h.time);
                histValues = portfolio.history.map(h => h.value);
            } else {
                timeLabels = [t.initBase, portfolio.history.length === 1 ? portfolio.history[0].time : t.latest];
                histValues = [totalCost, totalVal];
            }

            const ctxLine = document.getElementById('portfolioLineChart').getContext('2d');
            if (lineChart) lineChart.destroy();
            lineChart = new Chart(ctxLine, {
                type: 'line',
                data: {
                    labels: timeLabels,
                    datasets: [{
                        data: histValues,
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.2,
                        pointRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: '#64748b', font: { size: 9 }, maxTicksLimit: 5 } },
                        y: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#64748b', font: { size: 9 } } }
                    }
                }
            });
        }

        window.onload = () => render();
    </script>
</body>
</html>
