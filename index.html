<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimPortfolio - 全球多资产持仓与净值追踪终端</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

    <!-- 顶部导航 -->
    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white text-lg">S</div>
                <span class="text-xl font-bold tracking-tight">SimPortfolio<span class="text-indigo-400 text-sm ml-2 font-normal">全球资产账本终端</span></span>
            </div>
            <div class="text-xs text-slate-400">
                支持：美股 / 港股 / A股 / ETF / 黄金 / 比特币 / 现金(余额宝)
            </div>
        </div>
    </header>

    <!-- 主体内容区 -->
    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- 左侧：持仓明细录入 (7列) -->
        <section class="lg:col-span-7 space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-slate-200">资产持仓明细账本</h2>
                    <div class="space-x-2">
                        <button onclick="addHoldingRow('stock')" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg transition shadow">
                            + 添加投资品
                        </button>
                        <button onclick="addHoldingRow('cash')" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg transition shadow">
                            + 添加现金/余额宝
                        </button>
                    </div>
                </div>
                <p class="text-xs text-slate-400 mb-4">提示：输入 <span class="text-emerald-400 font-bold">CASH</span> 代码时，数量代表现金总额，成本列代表<span class="text-emerald-400 font-bold">预期年化收益率(%)</span>。</p>

                <!-- 持仓表格 -->
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead>
                            <tr class="border-b border-slate-800 text-slate-400 text-xs">
                                <th class="pb-3 font-medium">资产代码 (Ticker)</th>
                                <th class="pb-3 font-medium">持股数量 / 现金金额</th>
                                <th class="pb-3 font-medium">成本价 / 年化收益率(%)</th>
                                <th class="pb-3 font-medium">现价 / 状态</th>
                                <th class="pb-3 font-medium text-right">操作</th>
                            </tr>
                        </thead>
                        <tbody id="holdings-table-body" class="divide-y divide-slate-800/60">
                            <!-- 动态生成 -->
                        </tbody>
                    </table>
                </div>

                <div class="mt-6 flex justify-between items-center">
                    <button onclick="saveAndRefresh()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium px-4 py-2 rounded-xl transition shadow">
                        保存并更新市值
                    </button>
                    <span class="text-xs text-slate-500">数据自动保存在本地浏览器中</span>
                </div>
            </div>
        </section>

        <!-- 右侧：资产总览与大类分布看板 (5列) -->
        <section class="lg:col-span-5 space-y-6">
            <!-- 核心统计卡片 -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                <h3 class="text-sm font-semibold text-slate-300">资产总览看板</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800/80">
                        <span class="text-xs text-slate-400 block mb-1">总资产净值</span>
                        <span id="total-portfolio-value" class="text-xl font-bold text-white">$0.00</span>
                    </div>
                    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800/80">
                        <span class="text-xs text-slate-400 block mb-1">总盈亏金额</span>
                        <span id="total-portfolio-profit" class="text-xl font-bold text-emerald-400">+$0.00</span>
                    </div>
                </div>
            </div>

            <!-- 资产配比图表 -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <h3 class="text-base font-semibold text-slate-200 mb-4">大类资产分布比例</h3>
                <div class="relative h-[260px] w-full flex items-center justify-center">
                    <canvas id="assetPieChart"></canvas>
                </div>
            </div>
        </section>

    </main>

    <!-- 核心逻辑脚本 -->
    <script>
        // 默认初始持仓范例（含股票、A股ETF、黄金、比特币、现金理财）
        let holdings = JSON.parse(localStorage.getItem('sim_holdings')) || [
            { ticker: 'QQQ', shares: 50, cost: 420 },
            { ticker: '510300.SS', shares: 2000, cost: 3.5 },
            { ticker: 'GLD', shares: 20, cost: 210 },
            { ticker: 'BTC-USD', shares: 0.1, cost: 60000 },
            { ticker: 'CASH', shares: 50000, cost: 2.3 } // 余额宝类现金：5万本金，年化2.3%
        ];

        let pieChart = null;

        function renderTable() {
            const tbody = document.getElementById('holdings-table-body');
            tbody.innerHTML = '';
            holdings.forEach((item, index) => {
                const isCash = item.ticker.toUpperCase() === 'CASH';
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="py-3 pr-2">
                        <input type="text" value="${item.ticker}" id="ticker-${index}" class="w-28 bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-xs text-indigo-300 font-bold uppercase focus:outline-none focus:border-indigo-500">
                    </td>
                    <td class="py-3 pr-2">
                        <input type="number" step="any" value="${item.shares}" id="shares-${index}" class="w-20 bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-xs text-white focus:outline-none focus:border-indigo-500" title="${isCash ? '现金总金额' : '持股数量'}">
                    </td>
                    <td class="py-3 pr-2">
                        <input type="number" step="any" value="${item.cost}" id="cost-${index}" class="w-20 bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-xs text-white focus:outline-none focus:border-indigo-500" title="${isCash ? '预期年化收益率(%)' : '平均成本价'}">
                    </td>
                    <td class="py-3 pr-2 text-xs text-slate-400">
                        计算中...
                    </td>
                    <td class="py-3 text-right">
                        <button onclick="removeRow(${index})" class="text-rose-400 hover:text-rose-300 text-xs px-2 py-1 bg-rose-950/30 rounded border border-rose-900/50">删除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            calculatePortfolio();
        }

        function addHoldingRow(type) {
            if (type === 'cash') {
                holdings.push({ ticker: 'CASH', shares: 10000, cost: 2.0 });
            } else {
                holdings.push({ ticker: 'AAPL', shares: 10, cost: 150 });
            }
            renderTable();
        }

        function removeRow(index) {
            holdings.splice(index, 1);
            renderTable();
        }

        function saveAndRefresh() {
            holdings = [];
            const rows = document.getElementById('holdings-table-body').children;
            for (let i = 0; i < rows.length; i++) {
                const ticker = document.getElementById(`ticker-${i}`).value.trim();
                const shares = Number(document.getElementById(`shares-${i}`).value) || 0;
                const cost = Number(document.getElementById(`cost-${i}`).value) || 0;
                holdings.push({ ticker, shares, cost });
            }
            localStorage.setItem('sim_holdings', JSON.stringify(holdings));
            calculatePortfolio();
        }

        function calculatePortfolio() {
            let totalVal = 0;
            let totalCost = 0;
            let labels = [];
            let values = [];

            holdings.forEach((item, index) => {
                let marketVal = 0;
                let costVal = 0;
                let displayInfo = '';

                const isCash = item.ticker.toUpperCase() === 'CASH';

                if (isCash) {
                    // 现金类：本金即市值，成本列代表预期年化收益率
                    marketVal = item.shares; 
                    costVal = item.shares;
                    displayInfo = `<span class="text-emerald-400 font-medium">现金理财 (年化 ${item.cost}%)</span>`;
                } else {
                    // 投资品类：模拟现价（后续可替换为真实行情 API）
                    let estimatedPrice = item.cost * (1 + (Math.sin(index + 1) * 0.15)); 
                    marketVal = item.shares * estimatedPrice;
                    costVal = item.shares * item.cost;
                    displayInfo = `
                        <span class="text-white font-medium">$${estimatedPrice.toFixed(2)}</span>
                        <span class="block text-[10px] text-indigo-400">市值: $${marketVal.toFixed(0)}</span>
                    `;
                }

                totalVal += marketVal;
                totalCost += costVal;

                labels.push(item.ticker);
                values.push(Math.round(marketVal));

                const row = document.getElementById('holdings-table-body').children[index];
                if (row) {
                    row.children[3].innerHTML = displayInfo;
                }
            });

            let totalProfit = totalVal - totalCost;
            document.getElementById('total-portfolio-value').innerText = `$${totalVal.toLocaleString('en-US', {maximumFractionDigits: 2})}`;
            
            const profitElem = document.getElementById('total-portfolio-profit');
            profitElem.innerText = `${totalProfit >= 0 ? '+' : ''}$${totalProfit.toLocaleString('en-US', {maximumFractionDigits: 2})}`;
            profitElem.className = `text-xl font-bold ${totalProfit >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;

            renderPieChart(labels, values);
        }

        function renderPieChart(labels, data) {
            const ctx = document.getElementById('assetPieChart').getContext('2d');
            if (pieChart) {
                pieChart.destroy();
            }
            pieChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: [
                            '#6366f1', '#ec4899', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#14b8a6'
                        ],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right', labels: { color: '#94a3b8', boxWidth: 12 } }
                    }
                }
            });
        }

        window.onload = () => {
            renderTable();
        };
    </script>
</body>
</html>
